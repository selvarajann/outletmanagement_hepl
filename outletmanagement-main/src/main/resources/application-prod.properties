spring.application.name=outletmanagement
server.port=${PORT:8080}

# ─── Production Database (Env variables required) ────────────────────────────
# Aiven MySQL requires SSL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:outlet_db}?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Disable Spring Batch auto schema creation
spring.batch.jdbc.initialize-schema=never

# Fix: Set to update for deployment
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Hibernate batch fetching
spring.jpa.properties.hibernate.default_batch_fetch_size=25
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# HikariCP Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.jackson.default-property-inclusion=non_null

# Multipart file upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Rate Limiting
app.rate-limit.max-requests=200
app.rate-limit.refill-seconds=60

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ─── API Keys & IMS Integration (Production endpoints) ───────────────────────
sarvam.ai.api-key=${SARVAM_API_KEY:}
sarvam.ai.base-url=https://api.sarvam.ai/v1/chat/completions
chatbot.system-prompt=You are a helpful and professional AI assistant for the Outlet Management System. You can help users understand stock orders, batches, products, outlets, divisions, inventory management, notifications, roles, and IMS integration. Provide clear, concise, and accurate answers based on the Outlet Management domain.

ims.base-url=${IMS_BASE_URL:https://flsrkbvh-8080.inc1.devtunnels.ms}
ims.api-key=${IMS_API_KEY:}
ims.orders-api-token=${IMS_ORDERS_API_TOKEN:}
ims.receipt-endpoint=/api/receipts
ims.inventory-snapshot-endpoint=/api/inventory-snapshot

# ─── Mailtrap / SMTP Configuration ───────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.mailtrap.io}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=noreply@outletmanagement.com
app.mail.from-name=Outlet Management System

# ─── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://outletmanagement-hepl.vercel.app}

# ─── Dashboard Analytics ─────────────────────────────────────────────────────
app.stock.low-threshold=10
app.stock.expiry-warning-days=30

# ─── Firebase FCM Push Notifications ─────────────────────────────────────────
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# ─── Actuator (Health & Metrics) ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
